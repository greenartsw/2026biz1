    <script>
      (function loadProjectReport() {
        var params = new URLSearchParams(window.location.search);
        var project = String(params.get("project") || "").toLowerCase();
        var scripts = [];
        if (project === "project3" || project === "p3") {
          scripts.push("./data-project3.js?v=20260813-companyfix1");
        }
        scripts.push("./app.js?v=20260814-summaryfit2");

        function loadNext() {
          var src = scripts.shift();
          if (!src) return;
          var script = document.createElement("script");
          script.src = src;
          script.onload = loadNext;
          document.body.appendChild(script);
        }

        loadNext();
      })();
    </script>
